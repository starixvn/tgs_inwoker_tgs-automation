receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    send_batch_size: 512  # 调整批处理的大小
    timeout: 5s
exporters:
  logging:
    loglevel: debug
  otlphttp:
    endpoint: "http://jaeger-collector:4318"
    tls:
      insecure: true
extensions:
  health_check:
  pprof:
  zpages:
service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp]

