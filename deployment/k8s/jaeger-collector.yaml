apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-collector
  namespace: devops
  labels:
    app: jaeger
    component: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
      component: collector
  template:
    metadata:
      labels:
        app: jaeger
        component: collector
    spec:
      containers:
      - name: jaeger-collector
        image: jaegertracing/jaeger-collector:1.42.0
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        - name: SPAN_STORAGE_TYPE
          value: "elasticsearch"
        - name: ES_SERVER_URLS
          value: "http://elasticsearch-es-default.eck:9200"
        ports:
        - containerPort: 14250
          name: grpc
          protocol: TCP
        - containerPort: 14268
          name: http
          protocol: TCP
        - containerPort: 14267
          name: http-old
          protocol: TCP
        - containerPort: 5778
          name: admin
          protocol: TCP
        - containerPort: 4318
          name: otlp
          protocol: TCP
        volumeMounts:
        - name: config-volume
          mountPath: /etc/jaeger
      volumes:
      - name: config-volume
        configMap:
          name: jaeger-collector-config