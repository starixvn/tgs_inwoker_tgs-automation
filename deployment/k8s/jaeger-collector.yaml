apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-collector
  namespace: devops
  labels:
    app: jaeger
    component: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
      component: collector
  template:
    metadata:
      labels:
        app: jaeger
        component: collector
    spec:
      containers:
      - name: jaeger-collector
        image: jaegertracing/jaeger-collector:1.42.0
        ports:
        - containerPort: 14250
          name: grpc
          protocol: TCP
        - containerPort: 14268
          name: http
          protocol: TCP
        - containerPort: 14267
          name: http-old
          protocol: TCP
        - containerPort: 5778
          name: admin
          protocol: TCP
        - containerPort: 4318
          name: otlp
          protocol: TCP
        volumeMounts:
        - name: config-volume
          mountPath: /etc/jaeger
        command:
        - "/jaeger-collector"
        args:
        - "--config.file=/etc/jaeger/jaeger-config.yml"
      volumes:
      - name: config-volume
        configMap:
          name: jaeger-collector-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-collector-config
  namespace: devops
  labels:
    app: jaeger
    component: collector
data:
  jaeger-config.yml: |
    # Jaeger Configurations here
    # 例如：
    # (根据需要调整配置)
    jaeger:
      samplers:
        default:
          type: const
          param: 1
      storage:
        type: "elasticsearch"
        elasticsearch:
          server-urls: "http://elasticsearch:9200"
          index-prefix: "jaeger"
    # 如果使用 OTLP 配置，可以添加：
    otlp:
      endpoint: "0.0.0.0:4318"
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: devops
  labels:
    app: jaeger
    component: collector
spec:
  ports:
  - port: 14250
    targetPort: 14250
    name: grpc
  - port: 14268
    targetPort: 14268
    name: http
  - port: 14267
    targetPort: 14267
    name: http-old
  - port: 5778
    targetPort: 5778
    name: admin
  - port: 4318
    targetPort: 4318
    name: otlp
  selector:
    app: jaeger
    component: collector
