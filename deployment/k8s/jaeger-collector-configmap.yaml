apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-collector-config
  namespace: devops
  labels:
    app: jaeger
    component: collector
data:
  jaeger-config.yml: |
    # Jaeger Configurations here
    # 例如：
    # (根据需要调整配置)
    jaeger:
      samplers:
        default:
          type: const
          param: 1
      storage:
        type: "elasticsearch"
        elasticsearch:
          server-urls: "http://elasticsearch:9200"
          index-prefix: "jaeger"
    # 如果使用 OTLP 配置，可以添加：
    otlp:
      endpoint: "0.0.0.0:4318"