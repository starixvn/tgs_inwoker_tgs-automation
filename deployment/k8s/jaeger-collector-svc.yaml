apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: devops
  labels:
    app: jaeger
    component: collector
spec:
  ports:
  - port: 14250
    targetPort: 14250
    name: grpc
  - port: 14268
    targetPort: 14268
    name: http
  - port: 14267
    targetPort: 14267
    name: http-old
  - port: 5778
    targetPort: 5778
    name: admin
  - port: 4318
    targetPort: 4318
    name: otlp
  selector:
    app: jaeger
    component: collector
